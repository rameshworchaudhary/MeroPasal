<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <!-- Circle Gradient Ring -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E01E84" />
      <stop offset="45%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#126EF6" />
    </linearGradient>

    <!-- Capital N Gradient -->
    <linearGradient id="nGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E01E84" />
      <stop offset="50%" stop-color="#9313EC" />
      <stop offset="100%" stop-color="#126EF6" />
    </linearGradient>

    <!-- Shop Text Gradient -->
    <linearGradient id="shopTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E01E84" />
      <stop offset="100%" stop-color="#126EF6" />
    </linearGradient>
  </defs>

  <!-- WHITE CIRCLE EMBLEM BADGE -->
  <g transform="translate(10, 10)">
    <!-- White Circle Background -->
    <circle cx="50" cy="50" r="46" fill="#FFFFFF" />
    
    <!-- Multi-color Gradient Border Ring -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ringGradient)" stroke-width="4.5" />

    <!-- STYLIZED CAPITAL 'N' EMBLEM -->
    <!-- Left Navy Vertical Stem of 'N' -->
    <rect x="24" y="28" width="10" height="44" rx="5" fill="#0B132B" />

    <!-- Gradient Diagonal and Right Stem forming Capital 'N' -->
    <path d="M 28 32 L 56 66 C 59 70 65 68 65 63 L 65 32 C 65 27 57 27 57 32 L 57 50 L 36 26 C 31 21 28 25 28 32 Z" fill="url(#nGradient)" />

    <!-- ORANGE SHOPPING BAG AT TOP RIGHT OF 'N' -->
    <g transform="translate(50, 18)">
      <!-- Bag Body -->
      <path d="M 4 8 C 4 6 6 5 8 5 L 20 5 C 22 5 24 6 24 8 L 22 22 C 22 24 20 25 18 25 L 10 25 C 8 25 6 24 6 22 Z" fill="#FF6B00" />
      <!-- Handle -->
      <path d="M 10 5 C 10 1 18 1 18 5" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" />
      <!-- Eyes & Smile -->
      <circle cx="11" cy="12" r="1" fill="#FFFFFF" />
      <circle cx="17" cy="12" r="1" fill="#FFFFFF" />
      <path d="M 12 16 Q 14 18 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- BRAND NAME: NexShop -->
  <text x="125" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#0B132B" letter-spacing="-1">Nex</text>
  
  <text x="228" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#shopTextGradient)" letter-spacing="-1">Shop</text>

  <!-- TAGLINE & NEPAL PILL -->
  <line x1="126" y1="92" x2="148" y2="92" stroke="#0B132B" stroke-width="2" stroke-linecap="round" />
  
  <text x="156" y="96" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#0B132B" letter-spacing="1.4">SABAI KURA, EKAI THAU MA</text>
  
  <line x1="334" y1="92" x2="354" y2="92" stroke="#0B132B" stroke-width="2" stroke-linecap="round" />

  <!-- Blue Pill Capsule with NEPAL -->
  <rect x="362" y="81" width="62" height="21" rx="10.5" fill="#126EF6" />
  <text x="393" y="95.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" letter-spacing="1.2" text-anchor="middle">NEPAL</text>
</svg>
