<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <!-- Multi-color Gradient Ring -->
    <linearGradient id="rainbowRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6007e" />
      <stop offset="20%" stop-color="#ff3300" />
      <stop offset="40%" stop-color="#ffaa00" />
      <stop offset="65%" stop-color="#00bfff" />
      <stop offset="85%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#8a00e6" />
    </linearGradient>

    <!-- Swoosh Cyan/Blue Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Shopping Bag Orange Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa000" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>

    <!-- Shop Text Gradient -->
    <linearGradient id="shopTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Drop Shadow for Badge -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- WHITE CIRCLE EMBLEM BADGE WITH SHADOW -->
  <g transform="translate(15, 15)">
    <!-- White Circle Background -->
    <circle cx="50" cy="50" r="47" fill="#FFFFFF" filter="url(#badgeShadow)" />
    
    <!-- Multi-color Rainbow Border Ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#rainbowRingGrad)" stroke-width="5" />

    <!-- STYLIZED EMBLEM GRAPHIC -->
    <!-- Dark Navy 'N' -->
    <path d="M 27 34 C 27 28 32 25 38 29 L 55 50 L 55 33 C 55 28 62 28 62 33 L 62 65 C 62 70 57 73 51 69 L 34 47 L 34 65 C 34 70 27 70 27 65 Z" fill="#0b1329" />

    <!-- Blue Swoosh Ribbon at Bottom of Emblem -->
    <path d="M 32 71 C 42 73 56 66 68 49 C 70 46 74 49 71 53 C 58 74 42 78 28 73 C 26 72 28 69 32 71 Z" fill="url(#swooshGrad)" />

    <!-- ORANGE SHOPPING BAG AT TOP RIGHT -->
    <g transform="translate(51, 19)">
      <!-- Bag Handle -->
      <path d="M 7 8 C 7 3 15 3 15 8" fill="none" stroke="#ff7700" stroke-width="2.8" stroke-linecap="round" />
      <!-- Bag Body -->
      <path d="M 3 9 C 3 7 5 6 7 6 L 15 6 C 17 6 19 7 19 9 L 21 24 C 21 26 19 28 17 28 L 5 28 C 3 28 1 26 1 24 Z" fill="url(#bagGrad)" />
      <!-- Bag Eyelet Dots -->
      <circle cx="7" cy="11" r="1.5" fill="#FFFFFF" />
      <circle cx="15" cy="11" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- BRAND NAME: NexShop -->
  <text x="135" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Nex</text>
  
  <text x="245" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="58" font-weight="900" fill="url(#shopTextGrad)" letter-spacing="-1.5">Shop</text>

  <!-- TAGLINE & NEPAL PILL -->
  <!-- Left Dash -->
  <line x1="136" y1="96" x2="158" y2="96" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  
  <!-- Tagline Text -->
  <text x="166" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#cbd5e1" letter-spacing="1.5">SABAI KURA, EKAI THAU MA</text>
  
  <!-- Right Dash -->
  <line x1="348" y1="96" x2="368" y2="96" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Blue Pill Capsule with NEPAL -->
  <rect x="376" y="85" width="66" height="22" rx="11" fill="#2563eb" />
  <text x="409" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="1.2" text-anchor="middle">NEPAL</text>
</svg>
